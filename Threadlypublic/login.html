<!DOCTYPE html>

>

<title>Login | THREADLY</title>

<script>
    (function () {

        const savedTheme =
            localStorage.getItem("threadlyTheme") ||
            "system";

        const prefersDark =
            window.matchMedia &&
            window.matchMedia(
                "(prefers-color-scheme: dark)"
            ).matches;

        const shouldUseDark =
            savedTheme === "dark" ||
            (
                savedTheme === "system" &&
                prefersDark
            );

        if (shouldUseDark) {
            document.documentElement.classList.add(
                "threadly-dark"
            );
        }

    })();
</script>

<link rel="stylesheet" href="style.css">

</head>
