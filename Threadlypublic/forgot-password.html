
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password | THREADLY</title>

    <style>

        :root {
            --background: #f7f5f2;
            --surface: #ffffff;
            --text: #171717;
            --muted: #737373;
            --accent: #7d2638;
            --border: #dedbd6;
        }

        .threadly-dark {
            --background: #111111;
            --surface: #1b1b1b;
            --text: #f5f5f5;
            --muted: #a3a3a3;
            --accent: #c45a70;
            --border: #333333;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--background);
            color: var(--text);
        }

        .auth-page {
            min-height: calc(100vh - 80px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 430px;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 40px;
        }

        .auth-heading {
            margin-bottom: 30px;
        }

        .auth-heading p {
            margin: 0 0 8px;
            color: var(--accent);
            font-size: 13px;
            letter-spacing: 2px;
        }

        .auth-heading h2 {
            margin: 0 0 10px;
            font-size: 32px;
        }

        .auth-heading span {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border);
            background: var(--background);
            color: var(--text);
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: var(--accent);
        }

        .auth-button {
            width: 100%;
            border: none;
            padding: 15px;
            background: var(--accent);
            color: white;
            cursor: pointer;
            font-size: 14px;
            letter-spacing: 1px;
            transition: 0.2s;
        }

        .auth-button:hover {
            opacity: 0.85;
        }

        .auth-message {
            min-height: 20px;
            margin: 0 0 18px;
            font-size: 14px;
            color: var(--muted);
            line-height: 1.5;
        }

        .back-link {
            display: block;
            margin-top: 22px;
            text-align: center;
            color: var(--accent);
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            opacity: 0.7;
        }

        @media (max-width: 480px) {

            .auth-page {
                padding: 25px 15px;
            }

            .auth-container {
                padding: 30px 22px;
            }

            .auth-heading h2 {
                font-size: 28px;
            }

        }

    </style>

    <script>

        (function () {

            const savedTheme =
                localStorage.getItem("threadlyTheme") ||
                "system";

            const prefersDark =
                window.matchMedia &&
                window.matchMedia(
                    "(prefers-color-scheme: dark)"
                ).matches;

            const shouldUseDark =
                savedTheme === "dark" ||
                (
                    savedTheme === "system" &&
                    prefersDark
                );

            if (shouldUseDark) {
                document.documentElement.classList.add(
                    "threadly-dark"
                );
            }

        })();

    </script>

</head>

<body>

<main class="auth-page">

    <div class="auth-container">

        <div class="auth-heading">

            <p>ACCOUNT RECOVERY</p>

            <h2>Forgot Password?</h2>

            <span>
                Enter your email address and we'll send you
                a link to reset your password.
            </span>

        </div>


        <form id="forgotPasswordForm">

            <div class="form-group">

                <label for="resetEmail">
                    Email Address
                </label>

                <input
                    type="email"
                    id="resetEmail"
                    autocomplete="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <p
                id="resetMessage"
                class="auth-message"
            ></p>


            <button
                type="submit"
                class="auth-button"
            >
                SEND RESET LINK
            </button>

        </form>


        <a
            href="login.html"
            class="back-link"
        >
            Back to Login
        </a>

    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-client.js"></script>

<script>

    const forgotPasswordForm =
        document.getElementById("forgotPasswordForm");

    const resetEmail =
        document.getElementById("resetEmail");

    const resetMessage =
        document.getElementById("resetMessage");

    const resetButton =
        forgotPasswordForm.querySelector(".auth-button");


    forgotPasswordForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();

            resetMessage.textContent =
                "Sending reset link...";

            resetButton.disabled = true;
            resetButton.style.opacity = "0.6";
            resetButton.style.cursor = "not-allowed";

            const email =
                resetEmail.value.trim();

            try {

                const supabase =
                    window.threadlySupabase;

                if (!supabase) {

                    resetMessage.textContent =
                        "THREADLY connection is not available.";

                    return;

                }


                const { error } =
                    await supabase.auth.resetPasswordForEmail(
                        email,
                        {
                            redirectTo:
                                window.location.origin +
                                "/reset-password.html"
                        }
                    );


                if (error) {
                    throw error;
                }


                resetMessage.textContent =
                    "If an account exists with this email, a password reset link has been sent.";

                forgotPasswordForm.reset();

            } catch (error) {

                console.error(error);

                resetMessage.textContent =
                    error.message ||
                    "Something went wrong. Please try again.";

            } finally {

                resetButton.disabled = false;
                resetButton.style.opacity = "";
                resetButton.style.cursor = "";

            }

        }
    );

</script>



</body>
</html>
