<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Create Account | THREADLY</title>


<script>

    (function () {

        const savedTheme =
            localStorage.getItem("threadlyTheme") ||
            "system";


        const prefersDark =
            window.matchMedia &&
            window.matchMedia(
                "(prefers-color-scheme: dark)"
            ).matches;


        const shouldUseDark =
            savedTheme === "dark" ||
            (
                savedTheme === "system" &&
                prefersDark
            );


        if (shouldUseDark) {

            document.documentElement.classList.add(
                "threadly-dark"
            );

        }

    })();

</script>


<link
    rel="stylesheet"
    href="style.css"
>

</head>

<body>

<header class="site-header">

<a
    href="index.html"
    class="logo-link"
>
    <h1>THREADLY</h1>
</a>


<nav class="desktop-nav">

    <a href="index.html">Home</a>

    <a href="shop.html">Shop</a>

    <a href="shop.html">Men</a>

    <a href="shop.html">Women</a>

    <a href="shop.html">Shoes</a>

    <a href="cart.html">Cart</a>

</nav>


<div class="header-actions">

    <button
        id="menuButton"
        class="menu-button"
        type="button"
        aria-label="Open menu"
    >
        ☰
    </button>

</div>

</header>

<div
    id="mobileMenu"
    class="mobile-menu"
>

<div class="mobile-menu-header">

    <h2>THREADLY</h2>


    <button
        id="closeMenu"
        class="close-menu"
        type="button"
        aria-label="Close menu"
    >
        ×
    </button>

</div>


<nav class="mobile-nav">

    <a href="login.html">
        Login
    </a>

    <a href="signup.html">
        Create Account
    </a>


    <div class="menu-divider"></div>


    <a href="settings.html">
        Settings
    </a>

    <a href="help.html">
        Help &amp; Support
    </a>

</nav>

</div>

<div
    id="menuOverlay"
    class="menu-overlay"
></div>

<main class="auth-page">

<div class="auth-container">


    <div class="auth-heading">

        <p>
            JOIN THREADLY
        </p>


        <h2>
            Create Account
        </h2>


        <span>
            Create your account to start shopping.
        </span>

    </div>



    <form id="signupForm">


        <div class="form-group">

            <label for="signupName">
                Full Name
            </label>


            <input
                type="text"
                id="signupName"
                autocomplete="name"
                placeholder="Enter your name"
                required
            >

        </div>



        <div class="form-group">

            <label for="signupEmail">
                Email Address
            </label>


            <input
                type="email"
                id="signupEmail"
                autocomplete="email"
                placeholder="Enter your email"
                required
            >

        </div>



        <div class="form-group">

            <label for="signupPhone">
                Phone Number
            </label>


            <input
                type="tel"
                id="signupPhone"
                autocomplete="tel"
                placeholder="Enter your phone number"
                required
            >

        </div>



        <div class="form-group">

            <label for="signupUsername">
                Username
            </label>


            <input
                type="text"
                id="signupUsername"
                autocomplete="username"
                placeholder="Choose a username"
                required
            >

        </div>



        <div class="form-group">

            <label for="signupPassword">
                Password
            </label>


            <input
                type="password"
                id="signupPassword"
                autocomplete="new-password"
                minlength="8"
                placeholder="Create a password"
                required
            >

        </div>



        <div class="form-group">

            <label for="signupConfirmPassword">
                Confirm Password
            </label>


            <input
                type="password"
                id="signupConfirmPassword"
                autocomplete="new-password"
                minlength="8"
                placeholder="Confirm your password"
                required
            >

        </div>



        <p
            id="signupMessage"
            class="auth-message"
        ></p>



        <button
            type="submit"
            class="auth-button"
        >
            CREATE ACCOUNT
        </button>

    </form>



    <p class="auth-switch">

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </p>

</div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-client.js"></script>

<script src="app.js"></script>

</body>

</html>
