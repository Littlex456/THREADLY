<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>THREADLY Vendor Products</title>

    <script>

        (function () {

            const savedTheme =
                localStorage.getItem(
                    "threadlyVendorTheme"
                ) || "light";


            if (
                savedTheme === "dark"
            ) {

                document.documentElement.classList.add(
                    "dark-mode"
                );

            }

        })();

    </script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>

    <style>

        :root {

            --background: #f7f5f2;
            --surface: #ffffff;
            --surface-2: #f1efeb;
            --text: #171717;
            --muted: #737373;
            --accent: #7d2638;
            --accent-dark: #641d2d;
            --border: #dedbd6;

            color-scheme: light;

        }


        :root.dark-mode {

            --background: #111111;
            --surface: #1b1b1b;
            --surface-2: #242424;
            --text: #f5f5f5;
            --muted: #a3a3a3;
            --accent: #c45a70;
            --accent-dark: #a84459;
            --border: #333333;

            color-scheme: dark;

        }


        * {

            box-sizing: border-box;

        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: var(--background);

            color: var(--text);

            transition:
                background-color 0.25s ease,
                color 0.25s ease;

        }


        .vendor-header {

            height: 70px;

            background: var(--surface);

            border-bottom: 1px solid var(--border);

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 30px;

            position: fixed;

            top: 0;

            left: 0;

            right: 0;

            z-index: 1000;

            transition:
                background-color 0.25s ease,
                border-color 0.25s ease;

        }


        .vendor-logo {

            font-size: 22px;

            font-weight: 700;

            letter-spacing: 1px;

        }


        .vendor-name {

            color: var(--muted);

            font-size: 14px;

        }


        .menu-button {

            display: none;

            border: none;

            background: none;

            font-size: 24px;

            cursor: pointer;

        }


        .vendor-sidebar {

            width: 240px;

            position: fixed;

            top: 70px;

            left: 0;

            bottom: 0;

            background: var(--surface);

            border-right: 1px solid var(--border);

            padding: 25px 15px;

            z-index: 900;

            transition:
                background-color 0.25s ease,
                border-color 0.25s ease;

        }


        .vendor-link {

            display: block;

            padding: 13px 15px;

            margin-bottom: 5px;

            color: var(--text);

            text-decoration: none;

            border-radius: 8px;

            font-size: 14px;

        }


        .vendor-link:hover {

            background: var(--background);

        }


        .vendor-link.active {

            background: var(--accent);

            color: white;

        }


        .logout-link {

            margin-top: 30px;

        }


        .vendor-main {

            margin-left: 240px;

            padding: 105px 35px 40px;

        }


        .page-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            margin-bottom: 30px;

        }


        .page-header h1 {

            margin: 0 0 6px;

            font-size: 30px;

        }


        .page-header p {

            margin: 0;

            color: var(--muted);

        }


        .add-product-button {

            background: var(--accent);

            color: white;

            border: none;

            padding: 13px 20px;

            border-radius: 7px;

            cursor: pointer;

            font-size: 14px;

        }


        .add-product-button:hover {

            background: var(--accent-dark);

        }


        .product-tools {

            background: var(--surface);

            transition:
                background-color 0.25s ease,
                border-color 0.25s ease;


            border: 1px solid var(--border);

            border-radius: 10px;

            padding: 20px;

            display: flex;

            gap: 15px;

            flex-wrap: wrap;

            margin-bottom: 25px;

        }


        .product-tools input,
        .product-tools select {

            padding: 12px;

            border: 1px solid var(--border);

            border-radius: 7px;

            background: var(--surface);

            color: var(--text);

            font-size: 14px;

            transition:
                background-color 0.25s ease,
                color 0.25s ease,
                border-color 0.25s ease;

        }


        .product-search {

            flex: 1;

            min-width: 220px;

        }


        .product-count {

            margin-bottom: 15px;

            color: var(--muted);

            font-size: 14px;

        }


        .product-table-wrapper {

            background: var(--surface);

            transition:
                background-color 0.25s ease,
                border-color 0.25s ease;


            border: 1px solid var(--border);

            border-radius: 10px;

            overflow-x: auto;

        }


        table {

            width: 100%;

            border-collapse: collapse;

            min-width: 750px;

        }


        th,
        td {

            padding: 16px;

            text-align: left;

            border-bottom: 1px solid var(--border);

            font-size: 14px;

        }


        th {

            color: var(--muted);

            font-weight: 600;

            background: var(--background);

        }


        tr:last-child td {

            border-bottom: none;

        }


        .product-image {

            width: 55px;

            height: 65px;

            object-fit: cover;

            border-radius: 6px;

            background: var(--background);

        }


        .product-name {

            font-weight: 600;

        }


        .product-category {

            color: var(--muted);

            font-size: 13px;

            margin-top: 4px;

        }


        .stock {

            font-weight: 600;

        }


        .stock.low {

            color: #a45b00;

        }


        .stock.out {

            color: #b42318;

        }


        .stock.good {

            color: #287044;

        }


        .action-buttons {

            display: flex;

            gap: 8px;

        }


        .action-button {

            padding: 8px 12px;

            color: var(--text);

            transition:
                background-color 0.2s ease,
                color 0.2s ease,
                border-color 0.2s ease;


            border-radius: 6px;

            border: 1px solid var(--border);

            background: var(--surface);

            cursor: pointer;

            font-size: 13px;

        }


        .action-button:hover {

            background: var(--background);

        }


        .delete-button {

            color: #b42318;

        }


        .empty-message {

            padding: 50px 20px;

            text-align: center;

            color: var(--muted);

        }


        .mobile-overlay {

            display: none;

        }


        @media (max-width: 900px) {

            .menu-button {

                display: block;

            }


            .vendor-name {

                display: none;

            }


            .vendor-sidebar {

                transform: translateX(-100%);

                transition: transform 0.25s ease;

            }


            .vendor-sidebar.open {

                transform: translateX(0);

            }


            .mobile-overlay {

                display: block;

                position: fixed;

                inset: 70px 0 0;

                background: rgba(0, 0, 0, 0.35);

                opacity: 0;

                visibility: hidden;

                transition: 0.25s ease;

                z-index: 850;

            }


            .mobile-overlay.open {

                opacity: 1;

                visibility: visible;

            }


            .vendor-main {

                margin-left: 0;

                padding: 100px 20px 30px;

            }


            .page-header {

                align-items: flex-start;

            }

        }


        @media (max-width: 500px) {

            .vendor-header {

                padding: 0 18px;

            }


            .vendor-main {

                padding-left: 15px;

                padding-right: 15px;

            }


            .page-header {

                flex-direction: column;

            }


            .page-header h1 {

                font-size: 25px;

            }


            .add-product-button {

                width: 100%;

            }


            .product-tools {

                flex-direction: column;

            }


            .product-tools input,
            .product-tools select {

                width: 100%;

            }

        }

    </style>

</head>


<body>


<header class="vendor-header">

    <div class="vendor-logo">
        THREADLY
    </div>


    <div
        class="vendor-name"
        id="vendorName"
    >
        Vendor
    </div>


    <button
        class="menu-button"
        id="menuButton"
    >
        ☰
    </button>

</header>



<aside
    class="vendor-sidebar"
    id="vendorSidebar"
>

    <a
        href="vendor-dashboard.html"
        class="vendor-link"
    >
        Dashboard
    </a>


    <a
        href="vendor-products.html"
        class="vendor-link active"
    >
        Products
    </a>


    <a
        href="vendor-orders.html"
        class="vendor-link"
    >
        Orders
    </a>
    <a
    href="vendor-customers.html"
    class="vendor-link"
>
    Customers
</a>


    <a
        href="vendor-payments.html"
        class="vendor-link"
    >
        Payments
    </a>


    <a
        href="vendor-inventory.html"
        class="vendor-link"
    >
        Inventory
    </a>


    <a
        href="vendor-settings.html"
        class="vendor-link"
    >
        Settings
    </a>


    <a
        href="#"
        class="vendor-link logout-link"
        id="logoutButton"
    >
        Log out
    </a>

</aside>



<div
    class="mobile-overlay"
    id="mobileOverlay"
></div>



<main class="vendor-main">


    <div class="page-header">

        <div>

            <h1>
                Products
            </h1>

            <p>
                Manage your THREADLY products.
            </p>

        </div>


        <button
            class="add-product-button"
            id="addProductButton"
        >
            + Add Product
        </button>

    </div>



    <div class="product-tools">

        <input
            type="text"
            id="productSearch"
            class="product-search"
            placeholder="Search products..."
        >


        <select id="categoryFilter">

            <option value="all">
                All Categories
            </option>

            <option value="clothing">
                Clothing
            </option>

            <option value="shoes">
                Shoes
            </option>

        </select>


        <select id="stockFilter">

            <option value="all">
                All Stock
            </option>

            <option value="in-stock">
                In Stock
            </option>

            <option value="low">
                Low Stock
            </option>

            <option value="out">
                Out of Stock
            </option>

        </select>

    </div>



    <div
        class="product-count"
        id="productCount"
    >
        Loading products...
    </div>



    <div class="product-table-wrapper">

        <table>

            <thead>

                <tr>

                    <th>
                        Product
                    </th>

                    <th>
                        Category
                    </th>

                    <th>
                        Price
                    </th>

                    <th>
                        Stock
                    </th>

                    <th>
                        Actions
                    </th>

                </tr>

            </thead>


            <tbody id="productTable">

            </tbody>

        </table>

    </div>


</main>



<script>

(async function () {


    const vendorName =
        document.getElementById("vendorName");


    const vendorMessage =
        document.getElementById("productCount");


    const productTable =
        document.getElementById("productTable");


    const productSearch =
        document.getElementById("productSearch");


    const categoryFilter =
        document.getElementById("categoryFilter");


    const stockFilter =
        document.getElementById("stockFilter");


    const menuButton =
        document.getElementById("menuButton");


    const vendorSidebar =
        document.getElementById("vendorSidebar");


    const mobileOverlay =
        document.getElementById("mobileOverlay");


    const logoutButton =
        document.getElementById("logoutButton");


    const addProductButton =
        document.getElementById("addProductButton");


    let products = [];


    function closeMenu() {

        vendorSidebar.classList.remove("open");

        mobileOverlay.classList.remove("open");

    }


    menuButton.addEventListener(
        "click",
        function () {

            vendorSidebar.classList.toggle("open");

            mobileOverlay.classList.toggle("open");

        }
    );


    mobileOverlay.addEventListener(
        "click",
        closeMenu
    );


    document.querySelectorAll(".vendor-link").forEach(
        function (link) {

            link.addEventListener(
                "click",
                closeMenu
            );

        }
    );


    addProductButton.addEventListener(
        "click",
        function () {

            window.location.href =
                "vendor-add-product.html";

        }
    );


    const supabase =
        window.threadlySupabase;


    if (!supabase) {

        vendorMessage.textContent =
            "Authentication service is unavailable.";

        return;

    }


    const {
        data: sessionData,
        error: sessionError
    } = await supabase.auth.getSession();


    if (sessionError) {

        window.location.replace("login.html");

        return;

    }


    if (
        !sessionData ||
        !sessionData.session ||
        !sessionData.session.user
    ) {

        window.location.replace("login.html");

        return;

    }


    const user =
        sessionData.session.user;


    const {
        data: profile,
        error: profileError
    } = await supabase
        .from("profiles")
        .select("full_name, role")
        .eq("id", user.id)
        .single();


    if (profileError || !profile) {

        vendorMessage.textContent =
            "Your vendor profile could not be loaded.";

        return;

    }


    if (
        profile.role !== "vendor" &&
        profile.role !== "admin"
    ) {

        window.location.replace("index.html");

        return;

    }


    vendorName.textContent =
        profile.full_name || "Vendor";


    async function loadProducts() {

        vendorMessage.textContent =
            "Loading products...";


        const {
            data,
            error
        } = await supabase
            .from("products")
            .select(`
                id,
                name,
                category,
                filter_category,
                price,
                image,
                in_stock,
                quantity
            `)
            .order(
                "created_at",
                {
                    ascending: true
                }
            );


        if (error) {

            console.error(
                "Products loading error:",
                error
            );

            vendorMessage.textContent =
                "Products could not be loaded.";

            return;

        }


        products =
            data || [];


        renderProducts();

    }


    function renderProducts() {

        const search =
            productSearch.value
                .trim()
                .toLowerCase();


        const category =
            categoryFilter.value;


        const stock =
            stockFilter.value;


        const filteredProducts =
            products.filter(
                function (product) {

                    const matchesSearch =
                        (product.name || "")
                            .toLowerCase()
                            .includes(search);


                    const matchesCategory =
                        category === "all" ||
                        product.filter_category === category ||
                        product.category === category;


                    let matchesStock = true;


                    if (stock === "in-stock") {

                        matchesStock =
                            product.in_stock &&
                            product.quantity > 3;

                    }


                    if (stock === "low") {

                        matchesStock =
                            product.quantity > 0 &&
                            product.quantity <= 3;

                    }


                    if (stock === "out") {

                        matchesStock =
                            !product.in_stock ||
                            product.quantity <= 0;

                    }


                    return (
                        matchesSearch &&
                        matchesCategory &&
                        matchesStock
                    );

                }
            );


        vendorMessage.textContent =
            filteredProducts.length +
            " product" +
            (
                filteredProducts.length === 1
                    ? ""
                    : "s"
            );


        productTable.innerHTML = "";


        if (!filteredProducts.length) {

            productTable.innerHTML = `
                <tr>
                    <td
                        colspan="5"
                        class="empty-message"
                    >
                        No products found.
                    </td>
                </tr>
            `;

            return;

        }


        filteredProducts.forEach(
            function (product) {

                let stockClass =
                    "good";


                let stockText =
                    product.quantity +
                    " in stock";


                if (
                    !product.in_stock ||
                    product.quantity <= 0
                ) {

                    stockClass =
                        "out";


                    stockText =
                        "Out of stock";

                } else if (
                    product.quantity <= 3
                ) {

                    stockClass =
                        "low";

                }


                const row =
                    document.createElement("tr");


                row.innerHTML = `

                    <td>

                        <div
                            style="
                                display:flex;
                                align-items:center;
                                gap:12px;
                            "
                        >

                            <img
                                src="${product.image || ""}"
                                class="product-image"
                                alt="${product.name}"
                            >


                            <div>

                                <div class="product-name">
                                    ${product.name}
                                </div>


                                <div class="product-category">
                                    ${product.id}
                                </div>

                            </div>

                        </div>

                    </td>


                    <td>
                        ${product.category || "-"}
                    </td>


                    <td>
                        ₦${Number(product.price).toLocaleString()}
                    </td>


                    <td>

                        <span class="stock ${stockClass}">
                            ${stockText}
                        </span>

                    </td>


                    <td>

                        <div class="action-buttons">

                            <button
                                class="action-button edit-button"
                                data-id="${product.id}"
                            >
                                Edit
                            </button>


                            <button
                                class="action-button delete-button"
                                data-id="${product.id}"
                            >
                                Delete
                            </button>

                        </div>

                    </td>

                `;


                productTable.appendChild(row);

            }
        );


        document
            .querySelectorAll(".edit-button")
            .forEach(
                function (button) {

                    button.addEventListener(
                        "click",
                        function () {

                            const id =
                                this.dataset.id;


                            window.location.href =
                                "vendor-add-product.html?id=" +
                                encodeURIComponent(id);

                        }
                    );

                }
            );


        document
            .querySelectorAll(".delete-button")
            .forEach(
                function (button) {

                    button.addEventListener(
                        "click",
                        function () {

                            deleteProduct(
                                this.dataset.id
                            );

                        }
                    );

                }
            );

    }


    async function deleteProduct(id) {

        const product =
            products.find(
                function (item) {

                    return item.id === id;

                }
            );


        if (!product) return;


        const confirmed =
            confirm(
                "Delete " +
                product.name +
                "?"
            );


        if (!confirmed) return;


        const {
            error
        } = await supabase
            .from("products")
            .delete()
            .eq("id", id);


        if (error) {

            console.error(
                "Product delete error:",
                error
            );


            alert(
                "The product could not be deleted."
            );


            return;

        }


        await loadProducts();

    }


    productSearch.addEventListener(
        "input",
        renderProducts
    );


    categoryFilter.addEventListener(
        "change",
        renderProducts
    );


    stockFilter.addEventListener(
        "change",
        renderProducts
    );


    logoutButton.addEventListener(
        "click",
        async function (event) {

            event.preventDefault();


            await supabase.auth.signOut();


            localStorage.removeItem(
                "threadlyLoggedIn"
            );


            localStorage.removeItem(
                "threadlyUser"
            );


            window.location.replace(
                "login.html"
            );

        }
    );


    await loadProducts();


})();

</script>


</body>

</html>
